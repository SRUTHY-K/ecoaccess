# ──────────────────────────────────────────────────────────────
# EcoAccess Command Center — CI/CD Pipeline
# ──────────────────────────────────────────────────────────────
# CI  → runs on every push & PR (pytest + vite build check)
# CD  → runs on push to main only, after CI passes
#        (Docker build → Artifact Registry → Cloud Run)
# ──────────────────────────────────────────────────────────────

name: EcoAccess CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel redundant runs on the same PR / branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ─── JOB 1: Continuous Integration ───────────────────────────
jobs:
  ci:
    name: Lint & Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.12"]
        node-version: ["20"]

    steps:
      # ── Checkout ──
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Python Setup ──
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest httpx

      # ── Backend Tests ──
      - name: Run backend unit tests
        env:
          PYTHONPATH: backend
          GOOGLE_GENAI_API_KEY: "test-placeholder"
        run: |
          pytest backend/tests/unit/ -v --tb=short

      - name: Run backend integration tests
        env:
          PYTHONPATH: backend
          GOOGLE_GENAI_API_KEY: "test-placeholder"
        run: |
          pytest backend/tests/integration/ -v --tb=short

      # ── Node.js Setup ──
      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      # ── Frontend Build Check ──
      - name: Verify frontend builds
        run: npm run build

